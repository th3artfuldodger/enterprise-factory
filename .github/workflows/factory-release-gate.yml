name: Factory Release Gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  governed-factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - name: Fetch satellite test dependencies
        run: bash scripts/ci_fetch_factory_test_deps.sh
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          bash scripts/ci_install_factory_test_deps.sh
      - name: Prepare data root
        run: sudo mkdir -p /app/data/config /app/data/secrets /app/data/state /app/data/logs && sudo chmod -R 0777 /app/data
      - name: Contract + governance suite
        env: {USE_SQLITE: "true", AIFACTORY_DATA_ROOT: /app/data}
        run: |
          python scripts/check_api_contract.py
          pytest -q tests/test_customer_factory_establishment.py tests/test_customer_factory_abuse.py tests/test_customer_plan_boundaries.py tests/test_production_readiness.py tests/test_provider_health_config.py tests/test_customer_journey_e2e.py
  frontend-quality:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web/frontend}}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: "20", cache: npm, cache-dependency-path: web/frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
