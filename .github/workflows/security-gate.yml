name: Security Gate
on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  secret-and-private-data-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan tracked repository
        run: python3 scripts/security_gate.py --tracked
      - name: Scan Git history
        run: python3 scripts/security_gate.py --history

  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight security-test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run security invariants
        run: |
          python -m pytest -q             tests/test_security_gate.py             tests/test_security_redaction.py             tests/test_http_errors_security.py             tests/test_url_safety.py             tests/test_upload_stream_security.py             tests/test_run_script_security.py             tests/test_security_authz_invariants.py
      - name: Reject malformed diffs
        run: git diff --check

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Python requirements
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Audit frontend production dependencies
        working-directory: web/frontend
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
