name: Security Gate
on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  secret-and-private-data-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Scan tracked repository
        run: python3 scripts/security_gate.py --tracked
      - name: Scan Git history
        run: python3 scripts/security_gate.py --history

  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install security-test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Run security invariants
        run: >-
          python -m pytest -q
          tests/test_security_gate.py
          tests/test_security_redaction.py
          tests/test_http_errors_security.py
          tests/test_url_safety.py
          tests/test_upload_stream_security.py
          tests/test_run_script_security.py
          tests/test_security_authz_invariants.py
          tests/test_launch_security_checklist.py
          tests/test_support_session_security.py
      - name: Reject malformed diffs
        run: git diff --check

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Audit Python requirements
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Audit frontend production dependencies
        working-directory: web/frontend
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
